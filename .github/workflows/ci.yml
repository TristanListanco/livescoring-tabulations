name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  web:
    name: Web tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: true
      E2E_PORT: 3100
      # Throwaway values for the throwaway stack below; nothing here is a real secret.
      ADMIN_PASSWORD: e2e-admin-password
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - uses: supabase/setup-cli@v3
        with:
          version: 2.119.0

      # A private Supabase (Postgres, PostgREST, Realtime, Storage) on the runner. Tests never touch a real project.
      - name: Start local Supabase
        run: supabase start -x studio,imgproxy,mailpit,postgres-meta,edge-runtime,logflare,vector,supavisor

      - name: Load the schema and point the app at it
        run: |
          eval "$(supabase status -o env)"
          test -n "$API_URL" && test -n "$ANON_KEY" && test -n "$SERVICE_ROLE_KEY" && test -n "$DB_URL"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f supabase/schema.sql
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY"
            echo "SUPABASE_SECRET_KEY=$SERVICE_ROLE_KEY"
            echo "SESSION_SECRET=$(openssl rand -hex 32)"
          } >> "$GITHUB_ENV"

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Run web tests
        run: npx playwright test

      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
