# Tabulous behind nginx, for running the app on a laptop over the venue Wi-Fi (README: Running on a laptop over the
# venue Wi-Fi). Include this file inside nginx's http { } block: Homebrew's nginx.conf includes servers/*, and Linux
# packages include conf.d/*.conf. The app itself listens on this laptop only (npm start -- -H 127.0.0.1), so every
# phone and tablet comes through here.
#
# Why: on its own the app can't tell the devices on the Wi-Fi apart. Next.js doesn't give server actions the
# connection's address, so the sign-in limits read X-Real-IP and X-Forwarded-For, which any device can send. Here
# both are replaced with the device's real address. nginx also lets go of slow or stalled connections, refuses
# oversized requests, and caps sign-in attempts per device.

# Sign-in pages and code links, per device: 20 a minute, with room for a burst. The app counts failed attempts too.
limit_req_zone $binary_remote_addr zone=tabulous_signin:10m rate=20r/m;

server {
    listen 80;
    listen [::]:80;
    server_name _;
    server_tokens off;

    # Server actions take up to 8 MB (next.config.ts), plus room for the form around them.
    client_max_body_size 9m;
    # A device that stalls is let go rather than holding a connection.
    client_header_timeout 10s;
    client_body_timeout 15s;
    send_timeout 30s;
    keepalive_timeout 30s;

    proxy_http_version 1.1;
    # The address the device used, port included: judge links, QR codes and the results link are built from it, and
    # Next.js checks a server action's Origin against it.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # The device's own address, replacing whatever it sent: what the sign-in limits count.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    # Pages stream as they render.
    proxy_buffering off;
    # The slowest response is a results PDF, which the app gives up on after a minute.
    proxy_read_timeout 75s;

    # Judge sign-in (the code form and the links in QR codes) and the admin sign-in. Not /judge/score: scoring is never
    # slowed down.
    location ~ ^/(judge|judge/join/[^/]+|admin/login)$ {
        limit_req zone=tabulous_signin burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}
